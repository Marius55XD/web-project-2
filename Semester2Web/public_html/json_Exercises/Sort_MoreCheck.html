
<!DOCTYPE html>
<html>
    <head>
        <title>Course notes example code</title>
        <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
        <meta http-equiv="Content-Language" content="en" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            #employeesTable td,
            #employeesTable th
            {
                min-width:100px;
                text-align: left;
            }

            #employeesTable th
            {
                cursor:pointer;

            }

            #employeesTable th:hover
            {
                color:#888;
            }
        </style>

        <script>
            let employees = [{forename: "Ann", surname: "Connolly", role: "IT", salary: 50000, gender: "female"},
                {forename: "Dennis", surname: "Brown", role: "IT", salary: 45000, gender: "male"},
                {forename: "Cathy", surname: "Eagan", role: "HR", salary: 55000, gender: "female"},
                {forename: "Brian", surname: "Anglesey", role: "Accounts", salary: 5000, gender: "male"},
                {forename: "Emma", surname: "Doherty", role: "HR", salary: 60000, gender: "female"}]

            let keys = Object.keys(employees[0])
            
            // Get the unique set of employee roles (in this example, IT, HR, and Accounts
            let roles = employees.map(employee => employee.role)
            let roleCheckboxes = [...new Set(roles)].sort()                      

            let gender = employees.map(employee => employee.gender)
            let GenderCheckboxes = [...new Set(gender)].sort()  
            // Keep track of the sort order and sort field. 
            // Initially set the sort order to assending and sort field to forename
            let sortAssendingOrder = true
            let lastSortColumnName = "forename"
                        
            // Initialise the search value to be empty
            let searchValue = ""
		
                function displayCheckbox(checkboxes, divId)
                {
                     let htmlString = ""
                     checkboxes.forEach(checbox => htmlString += `<label for="${checbox}">${checbox}</label><input id="${checbox}" type="checkbox" checked="true" onclick="displayEmployeesTable()">`)
                     document.getElementById(divId).innerHTML = htmlString
                }
    
    
            // Display the unique roles (in this example, HR, IT, and Accounts) as a set of HTML checkboxes
            function displayRoleCheckboxes()
            {
                displayCheckbox(roleCheckboxes,"roles")
                let htmlString = ""
                roleCheckboxes.forEach(role => htmlString += `<label for="${role}">${role}</label><input id="${role}" type="checkbox" checked="true" onclick="displayEmployeesTable()">`)
                document.getElementById("roles").innerHTML = htmlString
            } 
            
             function displayGenderCheckboxes()
            {
                
                displayCheckbox(GenderCheckboxes,"gender")

                let htmlString = ""
                GenderCheckboxes.forEach(gender => htmlString += `<label for="${gender}">${gender}</label><input id="${gender}" type="checkbox" checked="true" onclick="displayEmployeesTable()">`)
                document.getElementById("gender").innerHTML = htmlString
            } 
		
			
            // search() will be called whenever the user changes the value in the HTML search box 
            function search(value)
            {
                searchValue = value
                displayEmployeesTable()
            }
            
            // Display the table based on the unique roles and search
            function displayEmployeesTable()
            {
                // filter by search
                let employeesToDisplay = employees.filter(employee => (employee.forename.toLowerCase().includes(searchValue.toLowerCase()) ||
                                                                       employee.surname.toLowerCase().includes(searchValue.toLowerCase())))
                
                // filter by role
                let filteredRoles = roleCheckboxes.filter(role => document.getElementById(role).checked)
                employeesToDisplay = employeesToDisplay.filter(employee => filteredRoles.includes(employee.role))
                
                // filter by gender
                let filteredGender = GenderCheckboxes.filter(gender => document.getElementById(gender).checked)
                employeesToDisplay = employeesToDisplay.filter(employee => filteredGender.includes(employee.gender))
                
                
                // create table HTML string
                let arrow = sortAssendingOrder === true ? "▲" : "▼"
                let htmlString = `<table id="employeesTable"><tr>`
                keys.forEach(key => htmlString += `<th onclick=sort("${key}")>${key}${lastSortColumnName === key ? arrow : ""}</th>`)
                htmlString += `</tr>`

                employeesToDisplay.forEach(employee => {
                    htmlString += `<tr>`

                    keys.forEach(key => htmlString += `<td>${employee[key]}</td>`)

                    htmlString += `</tr>`
                })
                
                htmlString += `</table>`

                // display table 
                document.getElementById("employeeTable").innerHTML = htmlString
            }

            // Sort the employees based on the sort direction and sort field
            function sort(key)
            {
                if (lastSortColumnName === key)
                {
                    sortAssendingOrder = !sortAssendingOrder
                }
                else
                {
                    lastSortColumnName = key
                    sortAssendingOrder = true
                }

                if (sortAssendingOrder)
                {
                    employees.sort((a, b) => a[key] < b[key] ? -1 : 1)
                }
                else
                {
                    employees.sort((a, b) => a[key] < b[key] ? 1 : -1)
                }
                displayEmployeesTable()
            }
        </script>
    </head>

    <body onload=" displayCheckbox(roleCheckboxes,'roles');displayCheckbox(GenderCheckboxes,'gender');displayEmployeesTable()">
        <label for="search">Search:</label><input type="search" id="search" oninput="search(this.value)">
        <div id="roles"></div>
        <div id="gender"></div>
        <div id="employeeTable"></div>
    </body>
</html>
